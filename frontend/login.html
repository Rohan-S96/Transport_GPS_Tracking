<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &mdash; Transport GPS Tracking</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Master Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #1E293B 0%, #0B0F19 70%);
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }
    .nav-tabs .nav-link {
      color: var(--text-muted);
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.75rem 1rem;
      font-weight: 600;
    }
    .nav-tabs .nav-link.active {
      background: transparent;
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
          <i class="bi bi-truck-front-fill"></i>
        </div>
        <h4 class="fw-bold text-white mb-1">Fleet Command Center</h4>
        <p class="text-muted small">Transport GPS Tracking & Telemetry System</p>
      </div>

      <!-- Tabs: Sign In / Register -->
      <ul class="nav nav-tabs nav-fill mb-4" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Sign In</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">Create Account</button>
        </li>
      </ul>

      <div class="tab-content" id="authTabsContent">
        <!-- LOGIN PANE -->
        <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
          <form id="login-form">
            <div class="mb-3">
              <label class="form-label small text-muted text-uppercase fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" id="login-email" class="form-control" placeholder="fleet@example.com" required autocomplete="email">
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label class="form-label small text-muted text-uppercase fw-semibold">Password</label>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" id="login-password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password">
              </div>
            </div>

            <div class="mb-4 form-check">
              <input type="checkbox" class="form-check-input" id="remember-me" checked>
              <label class="form-check-label small text-muted" for="remember-me">Remember credentials</label>
            </div>

            <button type="submit" id="btn-login-submit" class="btn btn-primary w-100 py-2 fs-6">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Fleet
            </button>
          </form>
        </div>

        <!-- REGISTER PANE -->
        <div class="tab-pane fade" id="register-pane" role="tabpanel">
          <form id="register-form">
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small text-muted text-uppercase fw-semibold">First Name</label>
                <input type="text" id="reg-first-name" class="form-control" placeholder="Rohan" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted text-uppercase fw-semibold">Last Name</label>
                <input type="text" id="reg-last-name" class="form-control" placeholder="Sharma" required>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label small text-muted text-uppercase fw-semibold">Organization / Carrier</label>
              <input type="text" id="reg-org-name" class="form-control" placeholder="FastTrack Logistics Ltd" required>
            </div>

            <div class="mb-2">
              <label class="form-label small text-muted text-uppercase fw-semibold">Work Email</label>
              <input type="email" id="reg-email" class="form-control" placeholder="rohan@fasttrack.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label small text-muted text-uppercase fw-semibold">Password (min 8 chars)</label>
              <input type="password" id="reg-password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" minlength="8" required>
            </div>

            <div class="mb-3">
              <label class="form-label small text-muted text-uppercase fw-semibold">Role</label>
              <select id="reg-role" class="form-select">
                <option value="fleet_manager">Fleet Manager (Full dispatch & control)</option>
                <option value="admin">System Admin (Full organization root)</option>
                <option value="driver">Driver (Telemetry & my trips)</option>
                <option value="viewer">Viewer (Read-only observation)</option>
              </select>
            </div>

            <button type="submit" id="btn-reg-submit" class="btn btn-primary w-100 py-2 fs-6">
              <i class="bi bi-person-check me-2"></i>Create Fleet Account
            </button>
          </form>
        </div>
      </div>

      <!-- API Indicator -->
      <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
        <span class="small text-muted" id="api-status-badge">
          <span class="spinner-grow spinner-grow-sm text-info me-1" role="status"></span>
          Verifying backend API link...
        </span>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // If already logged in, redirect to dashboard
      Auth.redirectIfAuthenticated();

      // Check API health status
      const statusBadge = document.getElementById('api-status-badge');
      try {
        const health = await ApiClient.get('/health');
        if (health.status === 'healthy' || health.success) {
          statusBadge.innerHTML = `<span class="text-success"><i class="bi bi-check-circle-fill me-1"></i>API Connected: ${CONFIG.API_BASE_URL}</span>`;
        }
      } catch (err) {
        statusBadge.innerHTML = `<span class="text-warning"><i class="bi bi-exclamation-triangle-fill me-1"></i>Backend: ${CONFIG.API_BASE_URL} (unreachable)</span>`;
      }

      // Handle Login
      const loginForm = document.getElementById('login-form');
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('btn-login-submit');
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';

        try {
          await Auth.login(email, password);
          Utils.showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 600);
        } catch (err) {
          Utils.showToast(err.message || 'Login failed. Please check credentials.', 'danger');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Fleet';
        }
      });

      // Handle Register
      const regForm = document.getElementById('register-form');
      regForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('btn-reg-submit');
        const firstName = document.getElementById('reg-first-name').value.trim();
        const lastName = document.getElementById('reg-last-name').value.trim();
        const orgName = document.getElementById('reg-org-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const role = document.getElementById('reg-role').value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

        try {
          const res = await Auth.register({
            first_name: firstName,
            last_name: lastName,
            organization_name: orgName,
            email,
            password,
            role,
          });

          if (res.success) {
            Utils.showToast('Account created! Logging in...', 'success');
            // Auto login
            await Auth.login(email, password);
            setTimeout(() => {
              window.location.href = '/index.html';
            }, 600);
          }
        } catch (err) {
          Utils.showToast(err.message || 'Registration failed', 'danger');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-person-check me-2"></i>Create Fleet Account';
        }
      });
    });
  </script>
</body>
</html>
