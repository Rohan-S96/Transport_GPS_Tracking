<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account &mdash; Transport GPS Tracking</title>
  <script>
    (function() {
      try {
        const t = localStorage.getItem('tgt_theme') || 'dark';
        document.documentElement.setAttribute('data-bs-theme', t);
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Master Styles -->
  <link rel="stylesheet" href="assets/css/style.css?v=1.3.3">
  <link rel="stylesheet" href="assets/css/components.css?v=1.3.3">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #1E293B 0%, #0B0F19 70%);
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div class="auth-container position-relative">
    <div class="position-absolute top-0 end-0 p-3">
      <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Light / Dark Theme" aria-label="Toggle Light / Dark Theme">
        <i class="bi bi-sun-fill text-warning"></i>
      </button>
    </div>
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
          <i class="bi bi-truck-front-fill"></i>
        </div>
        <h4 class="fw-bold text-white mb-1">Create Fleet Account</h4>
        <p class="text-muted small">Transport GPS Tracking & Telemetry System</p>
      </div>

      <!-- Registration Form -->
      <form id="standalone-register-form">
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label small text-muted text-uppercase fw-semibold">First Name</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
              <input type="text" id="reg-first-name" class="form-control" placeholder="Rohan" required autocomplete="given-name">
            </div>
          </div>
          <div class="col-6">
            <label class="form-label small text-muted text-uppercase fw-semibold">Last Name</label>
            <input type="text" id="reg-last-name" class="form-control" placeholder="Sharma" required autocomplete="family-name">
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label small text-muted text-uppercase fw-semibold">Organization / Carrier</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-buildings"></i></span>
            <input type="text" id="reg-org-name" class="form-control" placeholder="FastTrack Logistics Ltd" required autocomplete="organization">
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label small text-muted text-uppercase fw-semibold">Work Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" id="reg-email" class="form-control" placeholder="rohan@fasttrack.com" required autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small text-muted text-uppercase fw-semibold">Password (min 8 chars)</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" id="reg-password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" minlength="8" required autocomplete="new-password">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small text-muted text-uppercase fw-semibold">Account Role</label>
          <select id="reg-role" class="form-select bg-dark border-secondary text-white">
            <option value="fleet_manager" selected>Fleet Manager (Full dispatch & vehicle control)</option>
            <option value="admin">System Admin (Full organization root)</option>
            <option value="driver">Driver (Telemetry transmitter & assigned trips)</option>
            <option value="viewer">Viewer (Read-only observation)</option>
          </select>
        </div>

        <button type="submit" id="btn-reg-submit" class="btn btn-primary w-100 py-2 fs-6 mb-3">
          <i class="bi bi-person-check me-2"></i>Create Fleet Account
        </button>

        <div class="text-center text-muted small">
          Already have an account? 
          <a href="/login.html" class="text-primary text-decoration-none fw-semibold">
            Sign In here
          </a>
        </div>
      </form>

      <!-- API Indicator -->
      <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
        <span class="small text-muted" id="api-status-badge">
          <span class="spinner-grow spinner-grow-sm text-info me-1" role="status"></span>
          Connecting to backend API...
        </span>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // If already logged in, redirect to dashboard
      Auth.redirectIfAuthenticated();

      // Check API health status
      const statusBadge = document.getElementById('api-status-badge');
      try {
        const health = await ApiClient.get('/health');
        if (health.status === 'healthy' || health.success) {
          statusBadge.innerHTML = `<span class="text-success"><i class="bi bi-check-circle-fill me-1"></i>API Connected: ${CONFIG.API_BASE_URL}</span>`;
        }
      } catch (err) {
        statusBadge.innerHTML = `<span class="text-warning"><i class="bi bi-exclamation-triangle-fill me-1"></i>Backend: ${CONFIG.API_BASE_URL}</span>`;
      }

      // Handle Registration Form Submit
      const regForm = document.getElementById('standalone-register-form');
      regForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('btn-reg-submit');
        const firstName = document.getElementById('reg-first-name').value.trim();
        const lastName = document.getElementById('reg-last-name').value.trim();
        const orgName = document.getElementById('reg-org-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const role = document.getElementById('reg-role').value;

        if (password.length < 8) {
          Utils.showToast('Password must be at least 8 characters.', 'warning');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

        try {
          const res = await Auth.register({
            first_name: firstName,
            last_name: lastName,
            organization_name: orgName,
            email,
            password,
            role,
          });

          if (res.success) {
            Utils.showToast('Account created successfully! Redirecting...', 'success');
            
            // If token was returned, we are already logged in via Auth.register
            if (Auth.isAuthenticated()) {
              setTimeout(() => {
                window.location.href = '/index.html';
              }, 600);
            } else {
              // Fallback: log in explicitly
              await Auth.login(email, password);
              setTimeout(() => {
                window.location.href = '/index.html';
              }, 600);
            }
          } else {
            throw new Error(res.error || res.message || 'Registration failed');
          }
        } catch (err) {
          console.error('Registration error:', err);
          Utils.showToast(err.message || 'Registration failed. Please try again.', 'danger');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-person-check me-2"></i>Create Fleet Account';
        }
      });
    });
  </script>
</body>
</html>
